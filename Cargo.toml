[package]
name = "solidity-ast"
version = "0.0.1"
edition = "2024"

[dependencies]
semver = "1.0.26"
foundry-compilers = "0.19.10"
serde_json = "1.0.140"

## Vendored dependencies - See .cargo/config.toml for source substitution
# Mar 8, 2025: https://github.com/foundry-rs/foundry?branch=master#74b8a802
foundry-rs-config = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-ad5ff80cc8576274bc20e3218bafd4c9d45994fb", package = "foundry-config" }
serde = { version = "1.0.219", features = ["derive"] }
rayon = "1.10.0"
walkdir = "2.5.0"
itertools = "0.14.0"
svm-rs = ">=0.5.22"
svm-rs-builds = ">=0.5.22"

[dev-dependencies]
pretty_assertions = "1.4.1"
