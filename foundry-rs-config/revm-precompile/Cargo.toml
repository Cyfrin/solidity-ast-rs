[dependencies.p256]
version = "0.13.2"
features = ["ecdsa"]
default-features = false

[dependencies.primitives]
version = "21.0.2"
default-features = false
package = "revm-primitives"

[dependencies.ripemd]
version = "0.1.3"
default-features = false

[dependencies.rug]
