[package]
edition = "2021"
rust-version = "1.88.0"
name = "revm-precompile"
version = "31.0.0"
authors = ["Dragan Rakita <dragan0rakita@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Revm Precompiles - Ethereum compatible precompiled contracts"
readme = "README.md"
keywords = [
    "revm",
    "evm",
    "ethereum",
    "blockchain",
    "no_std",
]
license = "MIT"
repository = "https://github.com/bluealloy/revm"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
asm-keccak = ["primitives/asm-keccak"]
asm-sha2 = ["sha2/asm"]
blst = ["dep:blst"]
bn = ["dep:bn"]
c-kzg = ["dep:c-kzg"]
default = [
    "std",
    "secp256k1",
    "blst",
    "c-kzg",
    "portable",
]
gmp = ["dep:rug"]
hashbrown = ["primitives/hashbrown"]
portable = [
    "c-kzg?/portable",
    "blst?/portable",
]
secp256k1 = ["dep:secp256k1"]
std = [
    "primitives/std",
    "k256/std",
    "ripemd/std",
    "sha2/std",
    "c-kzg?/std",
    "secp256k1?/std",
    "ark-bn254/std",
    "ark-bls12-381/std",
    "aurora-engine-modexp/std",
    "ark-ec/std",
    "ark-ff/std",
    "ark-serialize/std",
    "ark-std/std",
    "p256/std",
    "rug?/std",
]

[lib]
name = "revm_precompile"
path = "src/lib.rs"

[[bench]]
name = "bench"
path = "bench/main.rs"
harness = false
required-features = ["secp256k1"]

[dependencies.ark-bls12-381]
version = "0.5"
features = ["curve"]
default-features = false

[dependencies.ark-bn254]
version = "0.5"
features = ["curve"]
default-features = false

[dependencies.ark-ec]
version = "0.5"
default-features = false

[dependencies.ark-ff]
version = "0.5"
features = ["asm"]
default-features = false

[dependencies.ark-serialize]
version = "0.5"
default-features = false

[dependencies.arrayref]
version = "0.3.6"

[dependencies.aurora-engine-modexp]
version = "1.2"
default-features = false

[dependencies.blst]
version = "0.3.15"
optional = true

[dependencies.bn]
